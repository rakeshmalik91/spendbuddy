<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Password Hash</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #1a1a24; color: #fff; }
        input { padding: 0.5rem; font-size: 1rem; margin-right: 1rem; border-radius: 4px; border: none; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; border-radius: 4px; border: none; background: #638aff; color: #fff; }
        #result { margin-top: 1rem; font-family: monospace; font-size: 1.2rem; word-break: break-all; background: #2a2a35; padding: 1rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Generate Secure Hash</h1>
    <p>Type your desired password below to generate the SHA-256 hash. Then copy the hash into app.js.</p>
    <input type="text" id="pwd" placeholder="Enter password...">
    <button onclick="generate()">Generate Hash</button>
    <div id="result">Hash will appear here...</div>

    <script>
        async function generate() {
            const pwd = document.getElementById('pwd').value;
            if(!pwd) return;
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pwd));
            const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('result').innerText = hash;
        }
    </script>
</body>
</html>
